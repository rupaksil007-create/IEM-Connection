<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEM Connector - Leaderboards</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
 <link rel="stylesheet" href="css/leaderboard.css">
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full" style="background:#000; color:#fff; overflow-y:auto;">
  <!-- Background Glow -->
  <div class="background-glow" style="top:10%; left:5%;"></div>
  <div class="background-glow" style="bottom:10%; right:5%;"></div><!-- Top Navigation -->
  <header class="fixed top-0 left-0 right-0 z-50 border-b border-white/[0.06]" style="background:rgba(0,0,0,0.85); backdrop-filter:blur(16px);">
   <nav class="flex items-center justify-between h-16 px-4 lg:px-8">
    <!-- Left: Logo -->
    <div class="flex items-center gap-3">
     <a href="#" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center">
       <span style="color:#000;font-weight:800;font-size:14px;">IC</span>
      </div><span id="navPlatformName" class="text-lg font-bold tracking-tight hidden sm:block">IEM Connector</span> </a>
    </div><!-- Center: Nav Links (Desktop) -->
    <div class="hidden lg:flex items-center gap-8">
     <a href="dashboard.html" class="nav-link text-sm font-medium text-white/50 hover:text-white">Dashboard</a> <a href="events.html" class="nav-link text-sm font-medium text-white/50 hover:text-white">Events</a> <a href="teams.html" class="nav-link text-sm font-medium text-white/50 hover:text-white">Teams</a> <a href="leaderboard.html" class="nav-link text-sm font-medium text-white text-white">Leaderboards</a> <a href="resources.html" class="nav-link text-sm font-medium text-white/50 hover:text-white">Resources</a> <a href="marketplace.html" class="nav-link text-sm font-medium text-white/50 hover:text-white">Marketplace</a>
    </div><!-- Right: Search and Profile -->
    <div class="flex items-center gap-4">
     <div class="relative hidden sm:flex">
      <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" style="width:16px;height:16px;"></i> <input type="text" id="searchInput" placeholder="Search leaderboards..." class="search-bar pl-10">
     </div><button class="text-white/50 hover:text-white transition" aria-label="Profile"> <i data-lucide="user-circle" style="width:24px;height:24px;"></i> </button>
    </div>
   </nav>
  </header><!-- Main Content -->
  <main class="relative z-10 px-4 lg:px-8 py-8 pt-24" style="min-height:100%;">
   <div class="max-w-7xl mx-auto">
    <!-- Page Header -->
    <div class="mb-12 fade-in">
     <div class="flex items-center gap-2 mb-4">
      <div class="glow-dot"></div><span class="text-xs font-medium text-white/50 uppercase tracking-widest">Rankings</span>
     </div>
     <h1 id="pageTitle" class="text-4xl sm:text-5xl font-bold tracking-tight mb-2">Event Leaderboards</h1>
     <p id="pageSubtitle" class="text-white/50 text-lg">Track top performers across competitions and events.</p>
    </div><!-- Event Selection -->
    <div class="mb-8 flex flex-col sm:flex-row items-start sm:items-end gap-6">
     <div><label for="eventSelect" class="block text-sm font-medium text-white/70 mb-2">Select Event</label>
      <div class="relative">
       <i data-lucide="calendar" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30 pointer-events-none" style="width:18px;height:18px;"></i> <select id="eventSelect" class="input-field pl-10 pr-4 py-2.5 text-sm text-white rounded-lg appearance-none cursor-pointer w-full sm:w-64" onchange="handleEventChange()"> <option value="hackathon">Hackathon 2026</option> <option value="workshop">AI Workshop</option> <option value="coding">Coding Contest</option> <option value="robotics">Robotics Challenge</option> </select>
      </div>
     </div>
    </div><!-- Top Performer Card -->
    <div class="mb-12 top-performer-card rounded-2xl p-8" style="background:#111; border:1px solid rgba(255,215,0,0.2);">
     <div class="flex items-center justify-between">
      <div>
       <div class="flex items-center gap-3 mb-2"><i data-lucide="trophy" style="width:28px;height:28px;color:#ffd700;"></i> <span class="text-sm font-medium text-white/50">Top Performer</span>
       </div>
       <h2 id="topPerformerName" class="text-3xl font-bold mb-1">Code Warriors</h2>
       <div class="flex items-center gap-4 text-white/50"><span id="topPerformerEvent" class="text-sm">Hackathon 2026</span> | <span id="topPerformerScore" class="text-lg font-bold text-white">980</span>
       </div>
      </div>
      <div class="text-6xl">
       🏆
      </div>
     </div>
    </div><!-- Leaderboard Type Tabs -->
    <div class="mb-8 border-b border-white/[0.06]">
     <div class="flex gap-8"><button class="tab-btn active" onclick="switchLeaderboard('individual')"> <i data-lucide="user" style="width:16px;height:16px; display:inline-block; margin-right:6px;"></i> Individual </button> <button class="tab-btn" onclick="switchLeaderboard('team')"> <i data-lucide="users" style="width:16px;height:16px; display:inline-block; margin-right:6px;"></i> Team </button> <button class="tab-btn" onclick="switchLeaderboard('department')"> <i data-lucide="building-2" style="width:16px;height:16px; display:inline-block; margin-right:6px;"></i> Department </button>
     </div>
    </div><!-- Leaderboard Table -->
    <div class="rounded-xl overflow-hidden" style="background:#111; border:1px solid rgba(255,255,255,0.06);">
     <div class="overflow-x-auto">
      <table class="leaderboard-table">
       <thead>
        <tr style="background:rgba(255,255,255,0.03);">
         <th class="px-6 py-4 text-left text-xs font-semibold text-white/50 uppercase">Rank</th>
         <th class="px-6 py-4 text-left text-xs font-semibold text-white/50 uppercase" id="nameHeader">Name</th>
         <th class="px-6 py-4 text-left text-xs font-semibold text-white/50 uppercase">Event</th>
         <th class="px-6 py-4 text-right text-xs font-semibold text-white/50 uppercase">Score</th>
         <th class="px-6 py-4 text-center text-xs font-semibold text-white/50 uppercase">Badge</th>
        </tr>
       </thead>
       <tbody id="leaderboardBody">
        <!-- Leaderboard rows will be inserted here -->
       </tbody>
      </table>
     </div>
    </div>
   </div>
  </main>
  <script src="js/leaderboard.js"></script>
 </body>
</html>
