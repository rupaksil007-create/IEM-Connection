<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEM Connector - Login</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  
 </head>
 <body class="h-full" style="background:#000; color:#fff;"><!-- Background Glow -->
  <div class="background-glow" style="top:10%; left:5%;"></div>
  <div class="background-glow" style="bottom:10%; right:5%;"></div><!-- Top Navigation -->
  <header class="fixed top-0 left-0 right-0 z-50 border-b border-white/[0.06]" style="background:rgba(0,0,0,0.85); backdrop-filter:blur(16px);">
   <nav class="flex items-center justify-between h-16 px-4 lg:px-8"><!-- Left: Logo -->
    <div class="flex items-center gap-3"><a href="#" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center"><span style="color:#000;font-weight:800;font-size:14px;">IC</span>
      </div><span id="navPlatformName" class="text-lg font-bold tracking-tight hidden sm:block">IEM Connector</span> </a>
    </div><!-- Center: Nav Links (Desktop) -->
    <!-- Right: Sign Up Link --> <a href="signup.html" class="text-sm font-medium text-white/50 hover:text-white transition">Sign Up</a>
   </nav>
  </header><!-- Main Content -->
  <main class="h-full flex items-center justify-center px-4 pt-16" style="min-height:100%;">
   <div class="w-full max-w-md"><!-- Header Section -->
    <div class="text-center mb-8 fade-in">
     <div class="flex justify-center mb-4">
      <div class="flex items-center gap-1.5">
       <div class="glow-dot"></div><span class="text-xs font-medium text-white/50 uppercase tracking-widest">Welcome Back</span>
      </div>
     </div>
     <h1 id="loginTitle" class="text-3xl sm:text-4xl font-bold tracking-tight mb-2">Login to IEM Connector</h1>
     <p id="loginSubtitle" class="text-white/50 text-sm">Access events, teams, and resources.</p>
    </div><!-- Login Card -->
    <div class="login-card rounded-2xl p-8" style="background:#111; border:1px solid rgba(255,255,255,0.06);">
     <form onsubmit="handleLogin(event)" class="space-y-5"><!-- Email Field -->
      <div><label for="email" class="block text-sm font-medium text-white/70 mb-2">College Email</label>
       <div class="relative"><i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" style="width:18px;height:18px;"></i> <input type="email" id="email" placeholder="example@college.edu" required class="input-field w-full pl-10 pr-4 py-2.5 text-sm text-white rounded-lg" aria-label="College Email">
        <div id="emailError" class="error-message hidden"></div>
       </div>
      </div><!-- Password Field -->
      <div><label for="password" class="block text-sm font-medium text-white/70 mb-2">Password</label>
       <div class="relative"><i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" style="width:18px;height:18px;"></i> <input type="password" id="password" placeholder="••••••••" required class="input-field w-full pl-10 pr-10 py-2.5 text-sm text-white rounded-lg" aria-label="Password"> <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40 password-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility"> <i id="eyeIcon" data-lucide="eye" style="width:18px;height:18px;"></i> </button>
        <div id="passwordError" class="error-message hidden"></div>
       </div>
      </div><!-- Forgot Password Link -->
      <div class="flex justify-end"><a href="#" id="forgotPasswordLink" class="link-secondary">Forgot Password?</a>
      </div><!-- Login Button --> <button type="submit" class="btn-login w-full py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2"> <i data-lucide="arrow-right" style="width:16px;height:16px;"></i> Login </button> <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
       <div class="divider-line flex-1"></div><span class="text-xs text-white/40">or</span>
       <div class="divider-line flex-1"></div>
      </div><!-- Sign Up Link -->
      <p class="text-center text-sm text-white/60"><span id="signupText">Don't have an account?</span> <a href="signup.html" class="text-white font-semibold hover:underline">Sign Up</a></p>
     </form>
    </div><!-- Security Message -->
    <div class="mt-6 text-center">
     <p class="text-xs text-white/40 flex items-center justify-center gap-2"><i data-lucide="shield" style="width:14px;height:14px;"></i> Your data is secure and encrypted</p>
    </div>
   </div>
  </main>
 <script src="js/main.js"></script>
 <script src="js/auth.js"></script>
 <script src="js/login.js"></script>
</body>
</html>
