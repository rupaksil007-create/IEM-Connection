<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEM Help - Signup</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/signup.css">
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full" style="background:#000; color:#fff; overflow-y:auto;"><!-- Background Glow -->
  <div class="background-glow" style="top:10%; left:5%;"></div>
  <div class="background-glow" style="bottom:10%; right:5%;"></div><!-- Top Navigation -->
  <header class="fixed top-0 left-0 right-0 z-50 border-b border-white/[0.06]" style="background:rgba(0,0,0,0.85); backdrop-filter:blur(16px);">
   <nav class="flex items-center justify-between h-16 px-4 lg:px-8"><!-- Left: Logo -->
    <div class="flex items-center gap-3"><a href="#" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center"><span style="color:#000;font-weight:800;font-size:14px;">IC</span>
      </div><span id="navPlatformName" class="text-lg font-bold tracking-tight hidden sm:block">IEM Connector</span> </a>
    </div><!-- Center: Nav Links (Desktop) -->
   <!-- Right: Login Link --> <a href="login.html" class="text-sm font-medium text-white/50 hover:text-white transition">Login</a>
   </nav>
  </header><!-- Main Content -->
  <main class="flex items-center justify-center px-4 py-8 pt-24 pb-8" style="min-height:100%;">
   <div class="w-full max-w-lg"><!-- Header Section -->
    <div class="text-center mb-8 fade-in">
     <div class="flex justify-center mb-4">
      <div class="flex items-center gap-1.5">
       <div class="glow-dot"></div><span class="text-xs font-medium text-white/50 uppercase tracking-widest">Join Today</span>
      </div>
     </div>
     <h1 id="signupTitle" class="text-3xl sm:text-4xl font-bold tracking-tight mb-2">Create an Account</h1>
     <p id="signupSubtitle" class="text-white/50 text-sm">Join the IEM Connector platform to explore events, teams, and resources.</p>
    </div><!-- Signup Card -->
    <div class="signup-card rounded-2xl p-8" style="background:#111; border:1px solid rgba(255,255,255,0.06);">
     <form onsubmit="handleSignup(event)" class="space-y-4"><!-- Full Name -->
      <div><label for="fullName" class="block text-sm font-medium text-white/70 mb-2">Full Name</label>
       <div class="relative"><i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" style="width:18px;height:18px;"></i> <input type="text" id="fullName" placeholder="Your full name" required class="input-field w-full pl-10 pr-4 py-2.5 text-sm text-white rounded-lg" aria-label="Full Name">
        <div id="nameError" class="error-message hidden"></div>
       </div>
      </div><!-- College Email -->
      <div><label for="email" class="block text-sm font-medium text-white/70 mb-2">College Email</label>
       <div class="relative"><i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" style="width:18px;height:18px;"></i> <input type="email" id="email" placeholder="example@college.edu" required class="input-field w-full pl-10 pr-4 py-2.5 text-sm text-white rounded-lg" aria-label="College Email">
        <div id="emailError" class="error-message hidden"></div>
       </div>
      </div><!-- Department and Year Grid -->
      <div class="form-grid"><!-- Department -->
       <div><label for="department" class="block text-sm font-medium text-white/70 mb-2">Department</label>
        <div class="relative"><i data-lucide="book" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30 pointer-events-none" style="width:18px;height:18px;"></i> <select id="department" required class="input-field w-full pl-10 pr-4 py-2.5 text-sm text-white rounded-lg appearance-none cursor-pointer" aria-label="Department"> <option value="">Select Department</option> <option value="CSE">Computer Science (CSE)</option> <option value="IT">Information Technology (IT)</option> <option value="ECE">Electronics (ECE)</option> <option value="EEE">Electrical (EEE)</option> <option value="Mechanical">Mechanical</option> <option value="Civil">Civil</option> <option value="Other">Other</option> </select>
         <div id="departmentError" class="error-message hidden"></div>
        </div>
       </div><!-- Year -->
       <div><label for="year" class="block text-sm font-medium text-white/70 mb-2">Academic Year</label>
        <div class="relative"><i data-lucide="calendar" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30 pointer-events-none" style="width:18px;height:18px;"></i> <select id="year" required class="input-field w-full pl-10 pr-4 py-2.5 text-sm text-white rounded-lg appearance-none cursor-pointer" aria-label="Academic Year"> <option value="">Select Year</option> <option value="1st">1st Year</option> <option value="2nd">2nd Year</option> <option value="3rd">3rd Year</option> <option value="4th">4th Year</option> </select>
         <div id="yearError" class="error-message hidden"></div>
        </div>
       </div>
      </div><!-- Password -->
      <div><label for="password" class="block text-sm font-medium text-white/70 mb-2">Password</label>
       <div class="relative"><i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" style="width:18px;height:18px;"></i> <input type="password" id="password" placeholder="••••••••" required class="input-field w-full pl-10 pr-10 py-2.5 text-sm text-white rounded-lg" aria-label="Password"> <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40 password-toggle" onclick="togglePasswordVisibility('password', 'eyeIcon1')" aria-label="Toggle password visibility"> <i id="eyeIcon1" data-lucide="eye" style="width:18px;height:18px;"></i> </button>
        <div id="passwordError" class="error-message hidden"></div>
       </div>
      </div><!-- Confirm Password -->
      <div><label for="confirmPassword" class="block text-sm font-medium text-white/70 mb-2">Confirm Password</label>
       <div class="relative"><i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30" style="width:18px;height:18px;"></i> <input type="password" id="confirmPassword" placeholder="••••••••" required class="input-field w-full pl-10 pr-10 py-2.5 text-sm text-white rounded-lg" aria-label="Confirm Password"> <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40 password-toggle" onclick="togglePasswordVisibility('confirmPassword', 'eyeIcon2')" aria-label="Toggle confirm password visibility"> <i id="eyeIcon2" data-lucide="eye" style="width:18px;height:18px;"></i> </button>
        <div id="confirmPasswordError" class="error-message hidden"></div>
       </div>
      </div><!-- Signup Button --> <button type="submit" class="btn-signup w-full py-2.5 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 mt-6"> <i data-lucide="check" style="width:16px;height:16px;"></i> Create Account </button> <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
       <div class="divider-line flex-1"></div><span class="text-xs text-white/40">or</span>
       <div class="divider-line flex-1"></div>
      </div><!-- Login Link -->
      <p class="text-center text-sm text-white/60"><span id="loginText">Already have an account?</span> <a href="login.html" class="text-white font-semibold hover:underline">Login</a></p>
     </form>
    </div><!-- Security Message -->
    <div class="mt-6 text-center">
     <p class="text-xs text-white/40 flex items-center justify-center gap-2"><i data-lucide="shield" style="width:14px;height:14px;"></i> Your data is secure and encrypted</p>
    </div>
   </div>
  </main>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>

</body>
</html>
